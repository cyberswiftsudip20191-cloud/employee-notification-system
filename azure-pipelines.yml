# ============================================================
# Node.js + Express -> Azure App Service Linux
# CI/CD Pipeline
# ============================================================

trigger:
  branches:
    include:
      - main

variables:

  # Azure DevOps Service Connection NAME
  azureSubscription: 'YOUR-SERVICE-CONNECTION-NAME'

  # Azure App Service NAME
  webAppName: 'YOUR-AZURE-WEBAPP-NAME'

  # Node.js version
  nodeVersion: '20.x'

  # Build agent
  vmImageName: 'ubuntu-latest'


# ============================================================
# BUILD
# ============================================================

stages:

- stage: Build
  displayName: 'Build and Test'

  jobs:

  - job: Build
    displayName: 'Build Node.js Application'

    pool:
      vmImage: $(vmImageName)

    steps:

    # Install Node.js
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    # Install dependencies
    - script: |
        npm ci
      displayName: 'Install dependencies'

    # Build
    - script: |
        npm run build --if-present
      displayName: 'Build application'

    # Test
    - script: |
        npm test --if-present
      displayName: 'Run tests'

    # Remove development dependencies
    - script: |
        npm prune --omit=dev
      displayName: 'Prepare production dependencies'

    # Create ZIP
    - task: ArchiveFiles@2
      displayName: 'Create deployment package'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    # Publish artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        artifact: 'drop'


# ============================================================
# DEPLOY
# ============================================================

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: Deploy
    displayName: 'Deploy to Azure App Service'

    environment: 'production'

    pool:
      vmImage: $(vmImageName)

    strategy:

      runOnce:

        deploy:

          steps:

          - task: AzureWebApp@1
            displayName: 'Deploy Node.js application'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'NODE|20LTS'
              startUpCommand: 'npm start'