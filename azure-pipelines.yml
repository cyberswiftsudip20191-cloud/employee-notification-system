trigger:
  branches:
    include:
      - dev-branch

variables:
  azureSubscription: '2857750b-d8ce-453a-a08b-bffce94dcf3c'
  webAppName: 'employee-notification-system'
  nodeVersion: '20.x'
  vmImageName: 'ubuntu-latest'

stages:

# =========================
# BUILD
# =========================

- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: Build
    displayName: 'Build Node.js Application'

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        npm ci
      displayName: 'Install dependencies'

    - script: |
        npm run build --if-present
      displayName: 'Build application'

    - script: |
        npm test --if-present
      displayName: 'Run tests'

    - script: |
        npm prune --omit=dev
      displayName: 'Prepare production dependencies'

    - task: ArchiveFiles@2
      displayName: 'Create deployment package'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        artifact: 'drop'


# =========================
# DEPLOY
# =========================

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Azure App Service'

    environment: 'production'

    pool:
      vmImage: $(vmImageName)

    strategy:
      runOnce:
        deploy:

          steps:

          - task: AzureWebApp@1
            displayName: 'Deploy Node.js Application'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'NODE|20LTS'
              startUpCommand: 'npm start'